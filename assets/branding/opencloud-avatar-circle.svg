<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="OpenCloud avatar (circle)">
  <defs>
    <linearGradient id="tile" x1="96" y1="64" x2="928" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D0BCFF"/>
      <stop offset="0.52" stop-color="#A8C7FA"/>
      <stop offset="1" stop-color="#FFD9E2"/>
    </linearGradient>
    <clipPath id="round">
      <circle cx="512" cy="512" r="512"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1024" height="1024" fill="url(#tile)"/>
    <circle cx="836" cy="196" r="268" fill="#EADDFF" opacity="0.45"/>
    <circle cx="168" cy="884" r="300" fill="#FFD9E2" opacity="0.35"/>
  <circle cx="512" cy="512" r="192" fill="none" stroke="#4F378B" stroke-width="56"
          stroke-linecap="round" stroke-dasharray="980 226" transform="rotate(-35 512 512)"/>
  </g>
</svg>
